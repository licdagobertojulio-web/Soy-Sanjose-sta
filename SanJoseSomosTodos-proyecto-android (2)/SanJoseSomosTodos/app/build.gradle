plugins {
    id 'com.android.application'
}

android {
    namespace 'co.edu.iesanjose.convivencia'
    compileSdk 34

    defaultConfig {
        applicationId 'co.edu.iesanjose.convivencia'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
